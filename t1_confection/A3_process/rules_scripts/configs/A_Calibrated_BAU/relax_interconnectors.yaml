## represent the project pipeline from the maintained v18 Interconnectors sheet),
## but with headroom_factor: 1.0 (no slack beyond the pipeline data).
##
## B_Opt uses 1.5× on the 3 India-internal corridors without project
## data; A_CalBAU uses 1.0× (strict pipeline only).

