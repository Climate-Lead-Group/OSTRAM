    # Model external dependencies: Directories, Files, sheets and columns
########################################################################################
# Directories
A2_output: 'A2_Output_Params'
A2_output_otoole: 'A2_Outputs_Params_otoole'
Miscellaneous: 'Miscellaneous'
templates: 'templates'
executables: 'Executables'
outputs: 'Outputs'
concatenate_folder: 'concatenate_files'

# Files
otoole_config: 'conversion_format.yaml'
preprocess_data: 'preprocess_data.py'
osemosys_model: 'osemosys_fast_preprocessed.txt'
conv_format: 'conversion_format.yaml'
concat_csvs: 'concatenate_ostram.py'
inputs_file: 'Inputs.csv'
outputs_file: 'Outputs.csv'

# Prefixes and suffixes
prefix_final_files: 'OSTRAM_'
preprocess_data_name: 'Pre_processed_'
output_files: '_output'

base_scenario: 'BAU'

# Configuration parameters
########################################################################################
solver: 'cplex' # Could you use: 'glpk', 'cbc', 'cplex' and 'gurobi'

# For CBC use
iteration_time: 20000
cbc_random_seed: 12345        # Random seed for reproducibility

# For CPLEX use
cplex_threads: 4
cplex_random_seed: 12345      # Random seed for reproducibility

# For Gurobi use
gurobi_threads: 3
gurobi_seed: 12345            # Random seed for reproducibility

# For delete intermediate files
del_files: False

# For run only the main scenarios
only_main_scenario: False

# Paralle scenarios
parallel: False
# Number of scenario per run
max_x_per_iter: 4

# Write A2 otoole outputs
A2_otoole_outputs: True

# Write txt model
write_txt_model: True

# Create matrixes
create_matrix: True

# Execute OSeMOSYS model
execute_model: True

# Concatenate otoole csv
concat_otoole_csv: False

# Concatenate scenarios csv
concat_scenarios_csv: True

# Annualize capital investment
annualize_capital: False

########################################################################################
# === Storage stripping diagnostic ===
# Master switch. False (or absent) = pipeline runs unchanged (no strip).
strip_storage_active: True

# --- Tier 3: zero storage (baseline) --- ACTIVE
strip_storage_mode: "all"
strip_storage_targets: []
strip_storage_suffix: "NoStorage"

# --- Tier 1: just LKA SDS ---  (uncomment & comment Tier 3 above to use)
# strip_storage_mode: "tech"
# strip_storage_targets: ["SDSLKAXX01"]
# strip_storage_suffix: "NoLKASDS"

# --- Tier 2: all SDS (keep LDS) ---
# strip_storage_mode: "class"
# strip_storage_targets: ["SDS"]
# strip_storage_suffix: "NoSDS"

########################################################################################
# === PWRBCK cap-opening diagnostic ===
# Opens TotalAnnualMaxCapacity and TotalAnnualMaxCapacityInvestment for PWRBCK*
# backstop techs. Runs after strip_storage and before the careful XLSX repair.
open_pwrbck_active: True
open_pwrbck_value: 9999
open_pwrbck_pattern: "PWRBCK"
open_pwrbck_suffix: "OpenBCK"

########################################################################################
# === Older blunt reserve-margin repair ===
# Keep this disabled for the XLSX careful path. It is preserved in the B2 copy
# for compatibility, but the XLSX patcher below is the one intended for this config.
reserve_margin_repair_active: False

########################################################################################
# === Careful XLSX reserve-margin repair ===
# This calls patch_reserve_margin_repair_careful_xlsx.py.
# It produces e.g.:
#   Pre_processed_BAU_0_NoStorage_OpenBCK_RMCarefulXLSX.txt
reserve_margin_xlsx_active: True
reserve_margin_xlsx_suffix: "RMCarefulXLSX"
reserve_margin_xlsx_workbook: "firm_capacity_fallbacks_by_cr.xlsx"
reserve_margin_xlsx_sheet: "fallbacks"

# Reserve tag repairs.
# 1.0 means PWRBCK capacity gets full reserve capacity credit.
reserve_margin_xlsx_backstop_credit: 1.0

# 0.9 means 90% of PWRCCS installed capacity counts for reserve.
reserve_margin_xlsx_ccs_credit: 0.9

# Target firm fossil technologies whose stock/flow cap sentinel values may be replaced.
reserve_margin_xlsx_target_prefixes:
  - PWRPET
  - PWROIL
  - PWRNGS

# Only these current values are replaced in TotalAnnualMaxCapacity and
# TotalAnnualMaxCapacityInvestment. Other values are left untouched.
reserve_margin_xlsx_sentinel_values:
  - 0
  - 9999

# Optional stricter final-style alternatives:
# Use ONE of these after the diagnostic case solves.
#
# Alternative A: leave PWRBCK at default/no reserve credit.
# reserve_margin_xlsx_patch_backstop: False
#
# Alternative B: explicitly set PWRBCK reserve credit to zero.
# reserve_margin_xlsx_backstop_credit: 0
