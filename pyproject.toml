[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ostram"
version = "0.0.0"
description = "OSTRAM energy-system scenario preparation and compilation"
requires-python = ">=3.10"
dependencies = [
    "dvc",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "otoole>=1.1.1",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "XlsxWriter>=3.2.4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ostram*"]
namespaces = true

[tool.setuptools.package-data]
ostram = [
    "resources/compilation/*.yaml",
    "resources/compilation/templates/*.csv",
    "resources/preparation/country_templates/*/*.csv",
]
