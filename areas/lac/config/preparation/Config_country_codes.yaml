# ============================================================
# TEMPLATE GENERATION (for Z_generate_country_template.py)
# ============================================================
# Configure here and just run: python Z_generate_country_template.py
# The script processes each entry in the list sequentially.
#
# Fields per entry:
#   new_country:          3-letter ISO code for the new country
#   reference_country:    existing country to clone data from
#   region:               region code (default: XX). Use 2-letter code for sub-regions
#   interconnections:     list of neighbor codes (3-letter = region XX, 5-letter = explicit region)
#                         leave empty for zero interconnections
#                         remove the key entirely for legacy mode (copies reference topology)
#   centerpoint_lat:      latitude of the country/region centerpoint
#   centerpoint_lon:      longitude of the country/region centerpoint
#
# ── EXAMPLES ──────────────────────────────────────────────────
#
# Example 1: Single country, single region (most common case)
#   - new_country: MDV
#     reference_country: LKA
#     region: XX
#     centerpoint_lat: 1.924992
#     centerpoint_lon: 73.399658
#     interconnections:
#       - LKA
#
# Example 2: Multiple countries at once
#   - new_country: MMR
#     reference_country: BGD
#     region: XX
#     centerpoint_lat: 16.871311
#     centerpoint_lon: 96.199379
#     interconnections:
#       - BGD
#       - IND
#   - new_country: PAK
#     reference_country: IND
#     region: XX
#     centerpoint_lat: 24.87
#     centerpoint_lon: 66.99
#     interconnections:
#       - INDNO
#       - INDWE
#
# Example 3: Country with multiple regions (like India)
#   Each region needs its own entry with its own centerpoint.
#   Use 5-letter codes for interconnections to specific regions.
#   - new_country: CHN
#     reference_country: IND
#     region: SO                          # China South → CHNSO
#     centerpoint_lat: 23.145
#     centerpoint_lon: 113.325
#     interconnections:
#       - MMRXX
#       - CHNNO                           # connected to China North
#   - new_country: CHN
#     reference_country: IND
#     region: NO                          # China North → CHNNO
#     centerpoint_lat: 39.929
#     centerpoint_lon: 116.388
#     interconnections:
#       - CHNSO                           # connected to China South
#       - MNGXX
#
# ── ACTIVE CONFIGURATION ─────────────────────────────────────
template_generation:
  - new_country:
    reference_country:
    region:
    centerpoint_lat:
    centerpoint_lon:
    interconnections:

# Implausible technology-country combinations, derived from OG_csvs_inputs data
# (ResidualCapacity, CapitalCost, TotalAnnualMaxCapacityInvestment, TotalAnnualMaxCapacity).
# A combo is implausible when all four capacity parameters are zero/absent for every year.
# Format: technology_code -> list of country codes where it is implausible.
#
# Regenerated 2026-06-01 for the active Latin-American country set. In this dataset no
# PWR{source} technology carries an explicit zero hard-cap; capacity limits are either
# populated (>0) or absent (= unbounded in OSeMOSYS). The only data-supported exclusion is
# GAS: there is no PWRGAS technology at all (gas generation is modeled via CCG/OCG -> NGS),
# so GAS is implausible for every country. Any further (geographic/domain) exclusions must
# be curated manually.
implausible_combinations:
  # GAS (Natural Gas) - No PWRGAS technology in model; gas generation modeled via CCG/OCG -> NGS
  GAS: [ARG, BOL, BRA, BRB, CHL, COL, CRI, DOM, ECU, GTM, HND, HTI, MEX, NIC, PAN, PER, PRY, SLV, URY]

# Internal transmission losses, read by the A3 stage stage_internal_tx_losses
# (setup policy apply_internal_tx_losses).
internal_transmission:
  # ASSUMPTION: a transmission-only loss of 3% inside each country, uniform across
  # the 19 countries, 2023 to 2050, the same value the South Asia application uses.
  # It lies inside the range of transmission losses, 1.6% (Bolivia) to 3.7%
  # (Honduras), that IDB (2014), Power Lost: Sizing Electricity Losses in
  # Transmission and Distribution Systems in Latin America and the Caribbean, p. 33
  # (https://doi.org/10.18235/0012798), reports for 15 countries of the region,
  # Paraguay (8%) excepted.
  # Demand rows measured at the bus bar are multiplied by 1 - loss; an
  # interconnector sent from a bus-bar node draws 1 - loss per unit of activity.
  # OutputActivityRatio of the six internal families = 1 - loss. The value can be
  # set per country with a mapping of node code to loss (for example ARGXX: 0.03).
  transmission_loss: 0.03

