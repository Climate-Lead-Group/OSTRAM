# ============================================================
# MODEL SETTINGS
# ============================================================

# Reference year for the model (first year of the model horizon)
first_year: 2023

# Enable DSPTRN dispatch technology and 4-tier ELC routing (ELC00/01/02/03)
# When true, A2_AddTx adds DSPTRN technology and rewrites TRN interconnection fuels to ELC03
# When false, keeps 3-tier ELC routing (ELC00/01/02) without DSPTRN
enable_dsptrn: True
# Whether to add missing countries' demand data from OLADE generation file
# When true, A1 reads OLADE Excel to fill in countries not present in the input CSVs
add_missing_countries_from_olade: false

# PWR technology cleanup mode (handles PWR00/PWR01 duplicates):
#   "drop"  - drop PWR00 rows when PWR01 exists, then rename PWR01 (removes '01' suffix)
#   "merge" - sum PWR00 values into PWR01, then drop PWR00, then rename PWR01
#   false   - skip PWR cleanup entirely
pwr_cleanup_mode: merge

# Force Projection.Mode = "EMPTY" for TotalAnnualMaxCapacityInvestment on all PWR technologies
#   true  - override Projection.Mode to EMPTY for all PWR techs on that parameter
#   false - keep the auto-detected Projection.Mode
force_empty_max_capacity_investment_pwr: true

