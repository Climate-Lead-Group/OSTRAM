## build_cap_rule.yaml: LAC A_Calibrated_BAU (the study's Tendencial scenario)
##
## The settings below are South Asia A's, copied value for value from
## config/scenarios/A_Calibrated_BAU/build_cap_rule.yaml, which states their
## reasons and carries their ASSUMPTIONs: each generation technology with
## residual capacity or a planned build may build, each year, its share of its
## country's 2024 fleet times the year-on-year growth of the demand-scaled fleet
## times margin_factor 1.1 (zero in 2024 and before), raised to the planned build
## times 1.01 where a planned build exists; the families listed are held at that
## proportion. With the setup policy build_cap_replaces_workbook_values, these
## caps replace the build caps of the ported BAU workbook.
##
## floor_top_up: after those caps, every generation technology with a generation
## floor L(t,y) (TotalTechnologyAnnualActivityLowerLimit) gets caps large enough
## to reach it, computed every run from the workbook values:
##   out(t,y)     = CapacityToActivityUnit(t) x sum over time slices l of
##                  [CapacityFactor(t,l,y) x YearSplit(l,y)] x AvailabilityFactor(t,y)
##                  (PJ per GW; an absent factor counts as 1)
##   need(t,y)    = 1.01 x L(t,y) / out(t,y)   (GW)
##   deficit(t,y) = need(t,y) - ResidualCapacity(t,y) - sum of the caps of t
##                  from 2023 through y
## In year order, a positive deficit raises the cap of year y by the deficit; a
## blank cap is unbounded and skipped. New builds count as lasting to 2050.
## ASSUMPTION: 1.01 (all technologies, all years) is the rule's untie margin
## (UNTIE_MULTIPLIER), so the reachable output sits 1% above each floor and the
## two limits never tie.

rule_mode: proportional
margin_factor: 1.1

cap_multiplier_schedule:
  2023: 1.0
  2050: 1.0

technology_top_up_gw: 0.0

family_limits:
  COA: 1.0
  PET: 1.0
  OIL: 1.0
  BIO: 1.0
  WAS: 1.0

exempt_prefixes:
  - PWRSDS
  - PWRLDS

floor_top_up: true
