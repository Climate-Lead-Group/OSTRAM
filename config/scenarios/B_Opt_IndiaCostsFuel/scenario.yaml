scenario: B_Opt_IndiaCostsFuel
base_scenario: B_Optimised_VRE
description: >-
  The shared VRE ceilings applied to B_Optimised_VRE, then the edits of
  B_Opt_IndiaCosts: the CapitalCost and FixedCost of the existing generation and
  storage technologies of Bangladesh, Bhutan, Nepal, Sri Lanka and the Maldives,
  except the backstop, are set to the India values of the same family in each
  year. Where the India regions differ (coal, hydro and offshore wind), the
  values of the INDNO region are used. Then the fuel prices of these five
  countries (the VariableCost of their MIN fuel-supply technologies) are set to
  the India prices. Transmission is unchanged.
apply_vre_ceiling_layer: true
reuse_edits_from: B_Opt_IndiaCosts
edits:
- sheet: VariableCost
  techs: [MINCOABGD, MINCOABTN, MINCOALKA, MINCOAMDV, MINCOANPL]
  param: VariableCost
  op: copy_from_tech
  source_tech: MINCOAIND
  note: India (COA) fuel price (MINCOAIND)
- sheet: VariableCost
