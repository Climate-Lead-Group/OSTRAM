scenario: B_Opt_TradeCap15
base_scenario: B_Optimised_VRE
description: >-
  The shared VRE ceilings applied to B_Optimised_VRE. From 2027 to 2050, the
  yearly flow on each of Bangladesh's four import interconnectors is at most 15
  per cent of Bangladesh's demand that year (ELCBGDXX03) times that
  interconnector's share of Bangladesh's imports that year in the solved
  B_Optimised_VRE of the same run, with no allowance for exports. A year in
  which that result imports nothing gives each interconnector a limit of zero.
  The run stops when that result is missing. The activity of Bangladesh's new
  and repowered internal lines (TRNNLIBGDXX, TRNRPOBGDXX) is set to zero from
  2027. This scenario is not the gross import cap of
  B_Opt_Clipped_GrossImportCap15.
apply_vre_ceiling_layer: true
edits:
- sheet: Secondary Techs
  techs: [TRNBGDXXINDEA, TRNBGDXXINDNE, TRNBTNXXBGDXX, TRNNPLXXBGDXX]
  param: TotalTechnologyAnnualActivityUpperLimit
  op: import_share_cap
  result: B_Optimised_VRE
  share: 0.15  # the scenario's design setting: imports are at most 15 per cent of demand
  demand_fuel: ELCBGDXX03
  importer: BGDXX
  years: [2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036, 2037, 2038, 2039, 2040, 2041, 2042, 2043, 2044, 2045, 2046, 2047, 2048, 2049, 2050]
  create_if_absent: false
  note: import <= 15% of demand x the interconnector's import share in the solved
    B_Optimised_VRE (strict cap, no export allowance); study period 2027+ only
- sheet: Demand Techs
  tech: TRNNLIBGDXX
  param: TotalTechnologyAnnualActivityUpperLimit
  values: {'2027': 0.0, '2028': 0.0, '2029': 0.0, '2030': 0.0, '2031': 0.0, '2032': 0.0, '2033': 0.0, '2034': 0.0, '2035': 0.0, '2036': 0.0, '2037': 0.0, '2038': 0.0, '2039': 0.0, '2040': 0.0, '2041': 0.0, '2042': 0.0, '2043': 0.0, '2044': 0.0, '2045': 0.0, '2046': 0.0, '2047': 0.0, '2048': 0.0, '2049': 0.0, '2050': 0.0}
  create_if_absent: true
  note: new internal line activity set to zero (study period 2027+ only;
    base years left at calibrated mix)
- sheet: Demand Techs
  tech: TRNRPOBGDXX
  param: TotalTechnologyAnnualActivityUpperLimit
  values: {'2027': 0.0, '2028': 0.0, '2029': 0.0, '2030': 0.0, '2031': 0.0, '2032': 0.0, '2033': 0.0, '2034': 0.0, '2035': 0.0, '2036': 0.0, '2037': 0.0, '2038': 0.0, '2039': 0.0, '2040': 0.0, '2041': 0.0, '2042': 0.0, '2043': 0.0, '2044': 0.0, '2045': 0.0, '2046': 0.0, '2047': 0.0, '2048': 0.0, '2049': 0.0, '2050': 0.0}
  create_if_absent: true
  note: repowered internal line activity set to zero (study period 2027+ only;
    base years left at calibrated mix)
