## retirement_schedule.yaml: C_Target_VRE
## IDENTICAL to B_Optimised_VRE. Thermal retirements are physical
## and do not change between scenarios.
##
## ASSUMPTION: thermal plants retire linearly over lifetimes at the midpoints
## of design-life ranges, one lifetime per fuel in every country:
##   COA 35yr, NGS 30yr, PET 25yr, NUC 50yr

base_year: 2028

age_based:
  COA:
    lifetime_years: 35
    retirement_profile: linear
  NGS:
    lifetime_years: 30
    retirement_profile: linear
  PET:
    lifetime_years: 25
    retirement_profile: linear
  NUC:
    lifetime_years: 50
    retirement_profile: linear

exempt:
  - 'PWRHYD*'
  - 'PWRSPV*'
  - 'PWRWON*'
  - 'PWRBCK*'

scheduled: []
