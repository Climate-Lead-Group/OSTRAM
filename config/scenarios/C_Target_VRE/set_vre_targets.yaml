## C_Target_VRE: fixed external resource-specific generation shares (fractions).
## Source and arithmetic: ../../../../RESOURCE_SHARE_EVIDENCE.md, final 2026-09-15.
## India: original CEA-observation regional allocation, not demand reweighting.
## Sri Lanka: authorized Scenario 3 fallback; Annexes 8.3/8.4 contain MW, not GWh.
## Bangladesh: ATS In-Between; Table 4.3-1 imports removed from denominator.
## Maldives: 33% renewable-demand milestone used as an explicit solar proxy.
## Nepal hydro begins at 85%; Bhutan remains 90%. Neither is set from the 95% cap.
## Accepted A only converts these fixed shares to absolute domestic-generation floors.
## Historical pins, 2026 treatment, interpolation, 2027 convention and all
## envelope/pinning controls are unchanged. Early shares need not be non-binding.
## Scenario C has no dependency on B. No same-run or aggregate renewable target.

bau_results_path: ../Executables/A_Calibrated_BAU_0   # dir holding CalBAU output; script auto-finds the *output.csv
constraint_type: activity
max_floor_share: 0.95     # safety cap; high enough for the NPL/BTN hydro locks

## cap_envelope: for targets flagged cap_envelope: true (the flagged resource floors),
## set_vre_targets writes a bounded MaxCap/MaxCapInv that follows the floor's
## capacity trajectory (cap_needed = floor_gen / realized_yield from CalBAU).
## This replaces lid-exemption: solar is pinned near residual early and rises
## only as the external-share floor rises — no front-loading, no 9999. headroom is the
## slack above the floor-implied capacity (raise it if a solar floor goes
## infeasible due to curtailment at high penetration).
cap_envelope_headroom: 0.20      # generous capacity band -> solver stays well-conditioned
cap_envelope_min_inv_gw: 2.0     # minimum per-year build allowance (GW)
default_capacity_factor: 0.10    # fallback yield (× c2a) if CalBAU never built the tech

## pin_generation_to_target: pins VRE generation AT the external share via an
## activity UPPER limit = max(target_gen, CalBAU_gen), while the capacity
## envelope above stays generous. Result: solar/wind land exactly on target
## (no 20% overshoot) WITHOUT the degenerate narrow-capacity-band that stalls
## the solver. The max() guard keeps planned capacity (e.g. BGD solar) from
## being force-curtailed in early years.
pin_generation_to_target: true
pin_slack: 0.01                  # upper limit sits 1% above the floor (a narrow range, not an exact lower==upper equality)

## Approved target-side 2027 boundary exception. The canonical A-dependent
## value is retained in the change log as raw_derived_value before this cap.
activity_lower_caps:
  - {region: GLOBAL, technology: PWRWONINDWE, year: 2027, maximum: 227.414}
  - {region: GLOBAL, technology: PWRWONINDWE, year: 2028, maximum: 255.078}

