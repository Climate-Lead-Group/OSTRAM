## lid_rule.yaml: C_Target_VRE scenario override
## Differences from B_Optimised_VRE: this relaxation_schedule ends at 3.0 in
## 2050, where B's ends at 25.0, and this file lists no HYD or SHP family
## limits, where B lists 3.0 for each. No solar or wind exemption.
##
## set_vre_targets.py writes a capacity envelope (bounded MaxCap/MaxCapInv
## following the region's floor trajectory) for each target marked
## cap_envelope: true in set_vre_targets.yaml: solar in every listed
## country-region, and onshore wind in INDNO, INDSO, INDWE and LKAXX.

rule_mode: proportional
security_factor: 1.1

relaxation_schedule:
  2023: 1.0
  2027: 1.0
  2030: 1.1
  2035: 1.3
  2040: 1.5
  2045: 2.0
  2050: 3.0

lid_floor_gw: 0.1

family_relaxation_ceilings:
  COA: 1.0    # coal locked to BAU proportions
  PET: 1.01   # petroleum locked
  OIL: 1.01   # oil locked
  BIO: 1.0    # biomass locked — prevents floor accumulation
  WAS: 1.0    # waste locked
  NGS: 1.2    # gas gets slight room
  URN: 1.5    # nuclear moderate

exempt_prefixes:
  - PWRSDS     # Short-duration storage
  - PWRLDS     # Long-duration storage

adequacy_floor_schedule:
  2040: 0.0
  2045: 0.08
  2050: 0.20
