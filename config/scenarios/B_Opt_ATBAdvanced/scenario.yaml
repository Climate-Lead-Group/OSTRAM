scenario: B_Opt_ATBAdvanced
base_scenario: B_Optimised_VRE
description: >-
  B_Optimised_VRE with every cost that follows an NREL ATB 2025 path on the
  Advanced case instead of the Moderate case: in 2024 to 2050 the capital and
  fixed costs of solar PV, onshore and offshore wind, CSP, geothermal, biomass,
  battery storage and pumped storage equal their local 2023 value x
  ATB_Advanced(y) / ATB_Advanced(2023), with the same ATB sheet, class and
  financial case (Without Tax Credits) as B_Optimised_VRE. Each edit multiplies
  the B_Optimised_VRE value of one year by [ATB_Advanced(y) / ATB_Advanced(2023)]
  / [ATB_Moderate(y) / ATB_Moderate(2023)]. The energy cost of storage stays on
  the Moderate case, because scenario edits do not reach it. Everything else
  equals B_Optimised_VRE.
apply_vre_ceiling_layer: false
