scenario: A_Calibrated_BAU_TxCostHigh
base_scenario: A_Calibrated_BAU
description: >-
  A_Calibrated_BAU with the capital and fixed costs of the 18 interconnectors at their high
  bounding values, constant in real 2023 USD for 2023 to 2050; the bounds are an ASSUMPTION stated
  in the Costs section of docs/rules.md. Each bound sets route length, line rate, endpoint
  allowance and usable transfer capacity of every corridor to their highest-cost values together.
  Everything else equals A_Calibrated_BAU, whose costs are the central case.
apply_vre_ceiling_layer: false
