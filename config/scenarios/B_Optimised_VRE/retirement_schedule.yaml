## B_Optimised_VRE: thermal retirement schedule
##
## ASSUMPTION: thermal plants retire linearly over lifetimes at the midpoints
## of these design-life ranges, one lifetime per fuel in every country.
##
## Generic lifetime ranges:
##   COA 30–40 yr  →  midpoint 35
##   GAS 25–35 yr  →  midpoint 30
##   PET 20–30 yr  →  midpoint 25
##   NUC 40–60 yr  →  midpoint 50
##
## Same midpoints used across BAU and Opti; no defensible basis for
## differentiating lifetimes between scenarios.
##
## Scenario differentiation from BAU is via the build-cap rule's cap_multiplier_schedule
## in build_cap_rule.yaml, NOT via retirement lifetimes.
##
## Sources: CEA NRAP 2025, IEPMP In-Between, IPSDP, CEB LTGEP 2025-2044,
##          Bhutan NEP 2025, ADB Maldives Road Map 2020, CCDR 2024/2025.

base_year: 2028

age_based:
  COA:
    lifetime_years: 35
    retirement_profile: linear
  NGS:
    lifetime_years: 30
    retirement_profile: linear
  PET:
    lifetime_years: 25
    retirement_profile: linear
  NUC:
    lifetime_years: 50
    retirement_profile: linear

exempt:
  - 'PWRHYD*'
  - 'PWRSPV*'
  - 'PWRWON*'
  - 'PWRBCK*'

scheduled: []
