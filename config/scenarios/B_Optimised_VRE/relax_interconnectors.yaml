## relax_interconnectors.yaml: B_Optimised_VRE
##
## Cross-border limits are computed from the scenario workbook, sheet
## Interconnector_Params, in every run; this file holds no copy of them.
## With cross_border_limit: lead_time_then_rate, relax_interconnectors.py
## gives each cross-border link (the two countries differ) without an
## override:
##   - up to and including lead_time_end_year, a total capacity
##     (TotalAnnualMaxCapacity) of its ResidualCapacity plus its forced builds
##     (TotalAnnualMinCapacityInvestment) still in service under
##     OperationalLife, and a yearly build cap
##     (TotalAnnualMaxCapacityInvestment) of the larger of its
##     ResidualCapacity and that year's forced build;
##   - after lead_time_end_year, a yearly build cap of the larger of
##     build_rate_gw and that year's forced build, with no residual floor, and
##     a total capacity of 9999, a finite cap, so cost sets the total size.
## A cross-border link may keep an override only when every value of it is 0;
## it then stays at its 2023 residual capacity.
##
## Each India-internal override below is the corridor's pipeline total for
## that year, in GW. relax_interconnectors.py uses it as the most new capacity
## the corridor may add in that year (TotalAnnualMaxCapacityInvestment),
## interpolated between the listed years, held after the last one and never
## below the corridor's residual capacity, and sets its TotalAnnualMaxCapacity
## to 9999, a finite cap, so total size is set by cost.
##
## The three India-internal corridors without project data have no override.
## Their build cap is headroom_factor times residual capacity.

mode: multiplicative
headroom_factor: 1.5          # build cap of corridors without an override = factor x residual capacity
cross_border_limit: lead_time_then_rate

# ASSUMPTION: until 2030, each cross-border link has only its existing capacity
# and the scenario's forced builds; no other cross-border line enters service
# before 2031. A new cross-border line takes several years from agreement to
# service, and the next Bangladesh to India line in the national plans, the
# Katihar-Parbotipur-Bornagar 765 kV corridor, is due in 2031.
# Central Electricity Authority, Ministry of Power, India, "National Electricity
# Plan, Volume II: Transmission," Oct. 2024,
# https://cea.nic.in/wp-content/uploads/psp___a_i/2025/02/NEP_Vol_II_Transmission.pdf,
# Sec 9.4.2, printed p.107; Annex scheme ER-11, printed p.442 gives 2031-32.
lead_time_end_year: 2030

# ASSUMPTION: from 2031, each cross-border link may add at most 1 GW a year, or
# more only where a forced build requires it; cost sets its total size. 1 GW is
# about one large line: New Butwal-Gorakhpur, the largest committed
# cross-border line, carries 1,000 MW.
# Nepal Electricity Authority, "A Year in Review, Fiscal Year 2025/2026,"
# Aug. 2026,
# https://nea.org.np/uploads/shares/td_tender/A%20Year%20In%20Review%20Annual%20Report%202025_2026_compressed.pdf,
# MD's Report printed p.5; Business Development printed p.99; Transmission
# printed pp.25-26.
build_rate_gw: 1.0

overrides:
  # ==========================================================================
  # CROSS-BORDER LINKS HELD AT THEIR RESIDUAL CAPACITY
  # ==========================================================================
  #
  # LKA → MDV: No projects in any pipeline; stays frozen
  TRNLKAXXMDVXX: {2023: 0}

  # MDV → IND-S: No projects in any pipeline; stays frozen
  TRNMDVXXINDSO: {2023: 0}

  # ==========================================================================
  # INDIA-INTERNAL CORRIDORS (pipeline < 3×: tighten to evidence)
  # ==========================================================================
  #
  # INDEA → INDNO (ResCap 22.53 GW): Sipat–Ranchi 765kV 3.0 GW COD 2029
  TRNINDEAINDNO: {2023: 22.53, 2029: 25.53}

  # INDEA → INDSO (ResCap 7.83 GW): Raipur–Pugalur 2nd HVDC 6.0 GW COD 2029
  TRNINDEAINDSO: {2023: 7.83, 2029: 13.83}

  # INDSO ↔ INDWE (ResCap 18.12 GW): Khargone–Pune 765kV 5.0 GW COD 2028
  TRNINDSOINDWE: {2023: 18.12, 2028: 23.12}

  # INDNE → INDEA (ResCap 3.53 GW): Bongaigaon–Siliguri 400kV 2.0 GW COD 2027
  TRNINDEAINDNE: {2023: 3.53, 2027: 5.53}
