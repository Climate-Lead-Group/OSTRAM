scenario: A_Calibrated_BAU_Clipped_TxFreeze2026
base_scenario: A_Calibrated_BAU
description: >-
  The shared VRE ceilings applied to A_Calibrated_BAU. From 2027, the capacity
  of each of the eleven international interconnectors has an upper limit equal
  to its capacity at the end of 2026 (TotalCapacityAnnual 2026) in the solved
  A_Calibrated_BAU_Clipped of the same run, including interconnectors with no
  capacity. New investment in these interconnectors in 2023 to 2026 is fixed to
  that result's NewCapacity. The committed investments after 2026 in
  TRNBTNXXBGDXX (2035) and TRNNPLXXBGDXX (2033) are set to zero, because the
  capacity is frozen. The run stops when the solved A_Calibrated_BAU_Clipped
  result is missing.
apply_vre_ceiling_layer: true
edits:
- sheet: Secondary Techs
  tech: TRNBGDXXINDEA
  param: TotalAnnualMaxCapacity
  op: from_result
  result: A_Calibrated_BAU_Clipped
  variable: TotalCapacityAnnual
  result_year: 2026
  years: [2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036, 2037, 2038, 2039, 2040, 2041, 2042, 2043, 2044, 2045, 2046, 2047, 2048, 2049, 2050]
  create_if_absent: true
  note: end-2026 capacity of the solved A_Calibrated_BAU_Clipped; 2023-2026 new
    vintages fixed to its NewCapacity; original retirement schedule retained.
- sheet: Secondary Techs
  tech: TRNBGDXXINDEA
  param: TotalAnnualMinCapacityInvestment
  op: from_result
  result: A_Calibrated_BAU_Clipped
  variable: NewCapacity
  years: [2023, 2024, 2025, 2026]
  create_if_absent: true
  note: end-2026 capacity of the solved A_Calibrated_BAU_Clipped; 2023-2026 new
    vintages fixed to its NewCapacity; original retirement schedule retained.
