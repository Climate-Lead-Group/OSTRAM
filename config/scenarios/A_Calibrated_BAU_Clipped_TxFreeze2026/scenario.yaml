scenario: A_Calibrated_BAU_Clipped_TxFreeze2026
base_scenario: A_Calibrated_BAU
description: >-
  The shared VRE ceilings applied to A_Calibrated_BAU. From 2027, the capacity
  of each of the eleven international interconnectors has an upper limit equal
  to its capacity at the end of 2026, including interconnectors with no
  capacity. New investment in these interconnectors in 2023 to 2026 is fixed.
  ASSUMPTION: the end-2026 capacities and the 2023 to 2026 investments were
  worked out once from an earlier model run of A_Calibrated_BAU_Clipped. They
  cannot be reproduced from the repository and are not recalculated.
apply_vre_ceiling_layer: true
