scenario: B_Opt_SolarCapexHi
base_scenario: B_Optimised_VRE
description: >-
  The shared VRE ceilings applied to B_Optimised_VRE. The CapitalCost of every
  solar technology (PWRSPV, all ten nodes) is multiplied by 1.10 in every year.
  To change the increase, edit the factor of its one edit.
apply_vre_ceiling_layer: true
edits:
- sheet: Secondary Techs
  tech_prefix: PWRSPV
  param: CapitalCost
  op: multiply
  factor: 1.1
  note: 'Setting: solar CAPEX multiplier. Default 1.10 (+10%). Edit this one number
    to rescale the shock; rides on top of per-node cost multipliers already in
    the A-O.'
