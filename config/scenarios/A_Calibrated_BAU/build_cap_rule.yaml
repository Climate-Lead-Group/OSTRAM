## build_cap_rule.yaml: A_Calibrated_BAU scenario override
##
## Key differences from B_Optimised_VRE:
##   - NO relaxation (flat 1.0×, pure BAU proportions for all families)
##   - ALL generation families locked at 1.0
##   - Storage STILL exempt (PWRSDS/PWRLDS not in GENERATION category,
##     so removing them from exempt causes MaxCapInv=0 vs MinCapInv>0
##     infeasibility). Use storage_delay_active: True in B2 YAML to
##     block early-year builds.

rule_mode: proportional
margin_factor: 1.1

## Flat: no relaxation for calibrated BAU
cap_multiplier_schedule:
  2023: 1.0
  2050: 1.0

## Minimum MaxCapInv (GW) per tech per year.
## 0.0 is the script default: no floor.
technology_top_up_gw: 0.0

## All generation families locked at BAU proportions.
## Combined with the floor-respects-ceiling fix, families with
## near-zero BAU share (BIO, WAS) get near-zero MaxCapInv.
family_limits:
  COA: 1.0
  PET: 1.0
  OIL: 1.0
  BIO: 1.0
  WAS: 1.0

## Storage must stay exempt to avoid MinCapInv > MaxCapInv
## infeasibility (storage techs are not GENERATION, so the lid
## script won't touch them otherwise and MaxCapInv stays at 0
## from upstream).
exempt_prefixes:
  - PWRSDS
  - PWRLDS
