## A_Calibrated_BAU — thermal retirement schedule  (v2)
##
## Lifetimes calibrated to midpoints of Natalia's country-level research
## (Energy_Data_for_YAML_ALL_6_Countries.xlsx, "Retirements" sheet, Note 8).
##
## Generic lifetime ranges (Note 8):
##   COA 30–40 yr  →  midpoint 35
##   GAS 25–35 yr  →  midpoint 30
##   PET 20–30 yr  →  midpoint 25
##   NUC 40–60 yr  →  midpoint 50
##
## Same midpoints used across BAU and Opti — no defensible basis for
## differentiating lifetimes between scenarios.
##
## Country-level consistency checks against Natalia's trajectory data:
##   - India COA: net growth 228→315 GW (CEA NRAP Sc.I). 35 yr linear
##     retirement is real but overwhelmed by new builds via MinCapInv.
##   - India GAS: flat ~20 GW through 2036. 30 yr life → retirements ≈
##     replacement, consistent with flat trajectory.
##   - Bangladesh PET: 7.4→5.4 GW by 2030. 25 yr life matches rental
##     plant expiry timeline (IEPMP In-Between).
##   - Sri Lanka COA: Lakvijaya commissioned 2011-2014, retires 2041-2044
##     (CEB LTGEP). 30 yr actual life sits within COA range; 35 yr
##     midpoint is a reasonable generic approximation.
##   - Nepal PET: 53 MW diesel phased out by 2030. 25 yr consistent.
##   - Maldives PET: gradual diesel displacement (ADB Road Map 2020).
##
## Sources: CEA NRAP 2025, IEPMP In-Between, IPSDP, CEB LTGEP 2025-2044,
##          Bhutan NEP 2025, ADB Maldives Road Map 2020, CCDR 2024/2025.

base_year: 2028

age_based:
  COA:
    lifetime_years: 35
    retirement_profile: linear
  NGS:
    lifetime_years: 30
    retirement_profile: linear
  PET:
    lifetime_years: 25
    retirement_profile: linear
  NUC:
    lifetime_years: 50
    retirement_profile: linear

exempt:
  - 'PWRHYD*'
  - 'PWRSPV*'
  - 'PWRWON*'
  - 'PWRBCK*'

scheduled: []
