## relax_interconnectors.yaml: A_Calibrated_BAU
##
## A's cross-border limits come from the scenario workbook, sheet
## Interconnector_Params, in every run; this file holds no copy of them.
## With cross_border_limit: existing_plus_committed, relax_interconnectors.py
## gives each of the 11 cross-border links (the two countries differ):
##   - a total capacity (TotalAnnualMaxCapacity) of its ResidualCapacity plus
##     its committed forced builds (TotalAnnualMinCapacityInvestment) still in
##     service under OperationalLife;
##   - a yearly build cap (TotalAnnualMaxCapacityInvestment) of the larger of
##     its ResidualCapacity and that year's forced build.
## No cross-border link may have an override here.
##
## Each India-internal override below is the corridor's pipeline total for
## that year, in GW. relax_interconnectors.py uses it as the most new capacity
## the corridor may add in that year (TotalAnnualMaxCapacityInvestment),
## interpolated between the listed years, held after the last one and never
## below the corridor's residual capacity, and sets its TotalAnnualMaxCapacity
## to 9999, a finite cap, so total size is set by cost.
##
## The three India-internal corridors without project data have no override.
## Their build cap is headroom_factor times residual capacity: 1.0 here,
## 1.5 in B_Optimised_VRE.

mode: multiplicative
headroom_factor: 1.0      # build cap of corridors without an override = factor x residual capacity
cross_border_limit: existing_plus_committed

overrides:
  # ── India-internal (large trunk corridors) ──
  TRNINDEAINDNO: {2023: 22.53, 2029: 25.53}
  TRNINDEAINDSO: {2023: 7.83, 2029: 13.83}
  TRNINDSOINDWE: {2023: 18.12, 2028: 23.12}
  TRNINDEAINDNE: {2023: 3.53, 2027: 5.53}
