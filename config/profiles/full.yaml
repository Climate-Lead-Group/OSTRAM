  B_Opt_LinkFreeze:
    scenario: B_Opt_LinkFreeze
    base_scenario: B_Optimised_VRE
    frozen_corridors:
    - TRNBGDXXINDEA
    - TRNNPLXXBGDXX
    description: Freeze interconnectors TRNBGDXXINDEA & TRNNPLXXBGDXX at 2023 residual
      (MaxCap=MaxCapInv=ResidualCapacity, all years). Relax YAML unchanged; freeze
      enforced via post-A3 patch because relax 2nd-pass sets MaxCap=9999. Over shared
      VRE-ceiling layer.
    apply_vre_ceiling_layer: true
    edits:
    - sheet: Secondary Techs
      tech: TRNBGDXXINDEA
      param: TotalAnnualMaxCapacity
      op: set_to_residual
      note: freeze at residual 2.5 GW (relax 2nd-pass would set 9999; enforced post-A3)
    - sheet: Secondary Techs
      tech: TRNBGDXXINDEA
      param: TotalAnnualMaxCapacityInvestment
      op: set_to_residual
      note: freeze at residual 2.5 GW (relax 2nd-pass would set 9999; enforced post-A3)
    - sheet: Secondary Techs
      tech: TRNNPLXXBGDXX
      param: TotalAnnualMaxCapacity
      op: set_to_residual
      note: freeze at residual 0.04 GW (relax 2nd-pass would set 9999; enforced post-A3)
    - sheet: Secondary Techs
      tech: TRNNPLXXBGDXX
      param: TotalAnnualMaxCapacityInvestment
      op: set_to_residual
      note: freeze at residual 0.04 GW (relax 2nd-pass would set 9999; enforced post-A3)
    - sheet: Secondary Techs
      tech: TRNBGDXXINDEA
      param: TotalAnnualMinCapacityInvestment
      op: clamp_to_residual
      residual_source: minimum_investment_boundary
      note: clamp MinCapInv to the separate v18 minimum-only compatibility boundary
    - sheet: Secondary Techs
      tech: TRNNPLXXBGDXX
      param: TotalAnnualMinCapacityInvestment
      op: clamp_to_residual
      residual_source: minimum_investment_boundary
      note: clamp MinCapInv to the separate v18 minimum-only compatibility boundary
  B_Opt_SolarCapex130:
    scenario: B_Opt_SolarCapex130
    base_scenario: B_Optimised_VRE
    description: 'PRIMARY sustained solar CAPEX stress. Solar CapitalCost x1.30 for
      all PWRSPV<node> (10 nodes), all years, over the shared VRE-ceiling layer. Literature-anchored:
      NREL ATB Conservative-vs-Moderate spread ~30%, IEA diversification premium,
      WACC-stress equivalent. Same mechanism as SolarCapexHi, factor 1.30.'
    apply_vre_ceiling_layer: true
    edits:
    - sheet: Secondary Techs
      tech_prefix: PWRSPV
      param: CapitalCost
      op: multiply
      factor: 1.3
      note: PWRSPV CAPEX x1.30, all years; rides on top of per-node cost multipliers
        already in the A-O.
  B_Opt_SolarCapexHi:
    scenario: B_Opt_SolarCapexHi
    base_scenario: B_Optimised_VRE
    description: 'Solar CapitalCost multiplied by ''factor'' (KNOB, default 1.10)
      for all PWRSPV<node>, all 10 nodes, all years. Over the shared VRE-ceiling layer
      (expected not to bind: dearer solar -> less solar). To change the stress level
      before CPLEX, edit the single ''factor'' value below.'
    apply_vre_ceiling_layer: true
    edits:
    - sheet: Secondary Techs
      tech_prefix: PWRSPV
      param: CapitalCost
      op: multiply
      factor: 1.1
      note: KNOB -- solar CAPEX multiplier. Default 1.10 (+10%). Edit this one number
        to rescale the shock; rides on top of per-node cost multipliers already in
        the A-O.
  B_Opt_SolarCapexSpike:
    scenario: B_Opt_SolarCapexSpike
    base_scenario: B_Optimised_VRE
    description: Transient severe solar CAPEX spike x1.50 for 2028-2030 ONLY (reverts
      to 1.0 elsewhere). Uses the multiply op's optional per-year 'years' filter (added
      to apply_patches.py for this scenario). Over the shared VRE-ceiling layer.
    apply_vre_ceiling_layer: true
    edits:
    - sheet: Secondary Techs
      tech_prefix: PWRSPV
      param: CapitalCost
      op: multiply
      factor: 1.5
      years:
      - 2028
      - 2029
      - 2030
      note: PWRSPV CAPEX x1.50 for 2028/2029/2030 only; all other years unchanged
        via the years filter.
  B_Opt_SolarHi10:
    scenario: B_Opt_SolarHi10
    base_scenario: B_Optimised_VRE
    description: Solar CapitalCost x1.10 for all PWRSPV<node>, all years. Over shared
      VRE-ceiling layer.
    apply_vre_ceiling_layer: true
    edits:
    - sheet: Secondary Techs
      tech_prefix: PWRSPV
      param: CapitalCost
      op: multiply
      factor: 1.1
      note: +10% solar CAPEX rides on top of per-node node multipliers
