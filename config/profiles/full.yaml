schema: ostram-profile-v1
id: full
metadata:
  title: OSTRAM full model
  country_regions: []
  interconnectors: []
  effective_values:
    TRNBGDXXINDEA_residual_capacity_gw: 2.496
policies:
  support_bau_committed_transmission: true
  reconcile_variable_cost_exports: true
  validation_no_mutation: true
  historical_trade_roots:
  - A_Calibrated_BAU
  - B_Optimised_VRE
  - C_Target_VRE
  lid_rule_new_semantics: false
authorities:
  scenario_registry: project:config/profiles/full.yaml
  scenario_inputs:
    path: project:inputs/scenarios
    kind: directory
  scenario_config_root:
    path: project:config/scenarios
    kind: directory
  scenario_workbook: project:inputs/scenarios/OSTRAM_Scenario_Inputs.xlsx
  timeslice_workbook: project:inputs/scenarios/OSTRAM_Timeslice_Inputs.xlsx
  ao_decisions: project:inputs/scenarios/OSTRAM_Scenario_Inputs.xlsx
  interconnector_authority: project:inputs/scenarios/OSTRAM_Scenario_Inputs.xlsx
  interconnector_taxonomy: project:config/scenarios/technology_types.csv
  compilation_config: project:config/compilation/Config_MOMF_T1_A.yaml
  execution_config: project:config/execution/Config_MOMF_T1_AB.yaml
  execution_inputs:
    path: project:inputs/execution
    kind: directory
  country_config: project:config/preparation/Config_country_codes.yaml
  region_config: project:config/preparation/Config_region_consolidation.yaml
  osemosys_inputs:
    path: project:inputs/osemosys_global
    kind: directory
  preparation_inputs:
    path: project:inputs/preparation
    kind: directory
  preparation_templates:
    path: project:inputs/preparation/workbook_templates
    kind: directory
  preparation_config:
    path: project:config/preparation
    kind: directory
  preparation_resources:
    path: package:resources/preparation
    kind: directory
  compilation_resources:
    path: package:resources/compilation
    kind: directory
  secondary_technology_inputs:
    path: project:inputs/preparation/secondary_technologies
    kind: directory
  maintained_model: project:model/osemosys_fast_preprocessed.txt
scenario_registry:
  schema: ostram-scenario-registry-v1
  support_scenarios:
  - BAU
  root_scenarios:
  - name: BAU
    role: support
    dependencies: []
  - name: A_Calibrated_BAU
    role: decision
    dependencies: []
  - name: B_Optimised_VRE
    role: decision
    dependencies: []
  - name: C_Target_VRE
    role: decision
    dependencies:
    - type: result
      scenario: A_Calibrated_BAU
      environment: OSTRAM_A_CALIBRATED_BAU_RESULT
      default_path: Executables/A_Calibrated_BAU_0
  decision_scenarios:
  - A_Calibrated_BAU
  - A_Calibrated_BAU_Clipped
  - B_Optimised_VRE
  - B_Opt_Clipped
  - B_Opt_DirBidir
  - B_Opt_DirContractual
  - B_Opt_IndiaCosts
  - B_Opt_IndiaCostsFuel
  - B_Opt_SolarCapex130
  - B_Opt_SolarCapexHi
  - B_Opt_SolarCapexSpike
  - B_Opt_TradeCap15
  - B_Opt_TxCap150
  - C_Target_VRE
  - C_Target_VRE_Clipped
  - A_Calibrated_BAU_Clipped_TxFreeze2026
  - B_Opt_Clipped_GrossImportCap15
  derived_scenarios:
  - name: A_Calibrated_BAU_Clipped
    base_scenario: A_Calibrated_BAU
  - name: B_Opt_Clipped
    base_scenario: B_Optimised_VRE
  - name: B_Opt_DirBidir
    base_scenario: B_Optimised_VRE
    direction_overlay: B_Opt_DirBidir/set_interconnector_direction.yaml
    direction_study_start_year: 2027
  - name: B_Opt_DirContractual
    base_scenario: B_Optimised_VRE
    direction_overlay: B_Opt_DirContractual/set_interconnector_direction.yaml
    direction_study_start_year: 2027
  - name: B_Opt_IndiaCosts
    base_scenario: B_Optimised_VRE
  - name: B_Opt_IndiaCostsFuel
    base_scenario: B_Optimised_VRE
  - name: B_Opt_SolarCapex130
    base_scenario: B_Optimised_VRE
  - name: B_Opt_SolarCapexHi
    base_scenario: B_Optimised_VRE
  - name: B_Opt_SolarCapexSpike
    base_scenario: B_Optimised_VRE
  - name: B_Opt_TradeCap15
    base_scenario: B_Optimised_VRE
  - name: B_Opt_TxCap150
    base_scenario: B_Optimised_VRE
  - name: C_Target_VRE_Clipped
    base_scenario: C_Target_VRE
  - name: A_Calibrated_BAU_Clipped_TxFreeze2026
    base_scenario: A_Calibrated_BAU
  - name: B_Opt_Clipped_GrossImportCap15
    base_scenario: B_Optimised_VRE
vre_ceilings:
  description: Shared VRE ceilings. Each value sets TotalAnnualMaxCapacity (GW) of
    one solar or onshore wind technology to the same value in every year. The values
    were chosen once as the lower of an atlas-based estimate and the historical
    B_Optimised_VRE limit. The pipeline applies them as fixed values and does not
    recalculate them.
  param: TotalAnnualMaxCapacity
  sheet: Secondary Techs
  ceilings_gw:
    PWRSPVINDEA: 150
    PWRSPVINDNE: 25
    PWRSPVINDNO: 600
    PWRSPVINDSO: 500
    PWRSPVINDWE: 650
    PWRSPVBGDXX: 40
    PWRSPVLKAXX: 16
    PWRSPVNPLXX: 40
    PWRSPVBTNXX: 1.8102
    PWRSPVMDVXX: 1
    PWRWONINDEA: 0.0
    PWRWONINDNE: 0.0
    PWRWONINDNO: 285
    PWRWONINDSO: 445
    PWRWONINDWE: 410
    PWRWONBGDXX: 3
    PWRWONLKAXX: 15
    PWRWONNPLXX: 0.0
    PWRWONBTNXX: 0.5
    PWRWONMDVXX: 0
scenario_inputs:
  A_Calibrated_BAU_Clipped:
    scenario: A_Calibrated_BAU_Clipped
    base_scenario: A_Calibrated_BAU
    description: 'The shared VRE ceilings applied to A_Calibrated_BAU. No other
      changes.'
    apply_vre_ceiling_layer: true
    edits: []
  B_Opt_Clipped:
    scenario: B_Opt_Clipped
    base_scenario: B_Optimised_VRE
    description: 'The shared VRE ceilings applied to B_Optimised_VRE. No other
      changes.'
    apply_vre_ceiling_layer: true
    edits: []
  B_Opt_DirBidir:
    scenario: B_Opt_DirBidir
    base_scenario: B_Optimised_VRE
    description: 'The shared VRE ceilings applied to B_Optimised_VRE. Every
      interconnector may carry power in both directions; its direction file lists no
      one-way corridors.'
    apply_vre_ceiling_layer: true
    edits: []
  B_Opt_DirContractual:
    scenario: B_Opt_DirContractual
    base_scenario: B_Optimised_VRE
    description: Interconnector directions locked to real contractual/physical flows
      (9 corridors one-way, Nepal<->India pair bidirectional). Shared VRE ceiling
      layer via scenario edits; direction overlay via set_interconnector_direction.py. Full
      per-corridor justification + citations in docs/reference/scenarios/interconnector_direction_references.md.
    apply_vre_ceiling_layer: true
    edits: []
  B_Opt_IndiaCosts:
    scenario: B_Opt_IndiaCosts
    base_scenario: B_Optimised_VRE
    description: 'CapitalCost and FixedCost of the existing non-India generation
      and storage technologies, except the backstop, set to the India values for
      each family and year. Where the India regions differ (coal, hydro and offshore
      wind), the INDNO values are used. Transmission and fuel prices are unchanged.
      Applied after the shared VRE ceilings. The values were first copied from the
      B_Optimised_VRE workbook and were updated in the September 2026 cost release.'
    apply_vre_ceiling_layer: true
