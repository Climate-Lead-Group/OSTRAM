scenario_inputs:
  A_Calibrated_BAU_Clipped:
    scenario: A_Calibrated_BAU_Clipped
    base_scenario: A_Calibrated_BAU
    description: 'Ceiling-only scenario: applies the shared VRE physical-potential
      ceiling layer (min(atlas, B_Opt MaxCap)) to the validated A_Calibrated_BAU A-O.
      No run-specific lever. Measures the cost of physical VRE realism on the BAU
      pathway.'
    apply_vre_ceiling_layer: true
    edits: []
  B_Opt_Clipped:
    scenario: B_Opt_Clipped
    base_scenario: B_Optimised_VRE
    description: 'Ceiling-only reference scenario: applies ONLY the shared VRE physical-potential
      ceiling layer (min(atlas, B_Opt MaxCap)) with no run-specific lever. The four
      sensitivities are measured against B_Opt_Clipped (not validated B_Opt) so each
      lever''s effect is isolated from the ceiling/clip effect. B_Opt_Clipped - B_Opt
      = the cost of physical VRE realism.'
    apply_vre_ceiling_layer: true
    edits: []
  B_Opt_DirBidir:
    scenario: B_Opt_DirBidir
    base_scenario: B_Optimised_VRE
    description: 'Interconnector-direction validation anchor: shared VRE ceiling layer
      + all cross-border corridors left bidirectional (set_interconnector_direction.py
      no-op). Must reproduce B_Opt_Clipped (2,113,984 -> clipped 2,115,082). Direction
      overlay applied post-apply_patches.'
    apply_vre_ceiling_layer: true
    edits: []
  B_Opt_DirContractual:
    scenario: B_Opt_DirContractual
    base_scenario: B_Optimised_VRE
    description: Interconnector directions locked to real contractual/physical flows
      (9 corridors one-way, Nepal<->India pair bidirectional). Shared VRE ceiling
      layer via patches; direction overlay via set_interconnector_direction.py. Full
      per-corridor justification + citations in sensitivity_expansion/reference/interconnector_direction_references.md.
    apply_vre_ceiling_layer: true
    edits: []
  B_Opt_IndiaCosts:
    scenario: B_Opt_IndiaCosts
    base_scenario: B_Optimised_VRE
    description: 'CapitalCost + FixedCost of every non-India generation/storage tech
      set to the India reference (per family/year; INDNO anchor where India nodes
      disagree: PWRCOA/PWRHYD/PWRWOF). Transmission (TRN corridors) excluded. Over
      shared VRE-ceiling layer. Fuel/VariableCost NOT changed (include_fuel=false).'
    include_fuel: false
    apply_vre_ceiling_layer: true
    edits:
