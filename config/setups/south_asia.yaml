schema: ostram-setup-v1
id: south_asia
metadata:
  title: OSTRAM South Asia model
  country_regions: []
  interconnectors: []
  effective_values:
    TRNBGDXXINDEA_residual_capacity_gw: 2.496
policies:
  support_bau_committed_transmission: true
  reconcile_variable_cost_exports: true
  validation_no_mutation: true
  historical_trade_roots:
  - A_Calibrated_BAU
  - B_Optimised_VRE
  - C_Target_VRE
  build_cap_replaces_workbook_values: false
  # Import cap at existing link capacity, active with the historical trade
  # roots. From first_year, the flow of each link from from_country to
  # to_country stays within what the link's residual capacity carries.
  # ASSUMPTION: new India-Nepal capacity serves Nepal's exports to India, as the
  # long-term power trade agreement of January 2024 (10,000 MW from Nepal to
  # India within ten years) describes, so India's flows into Nepal stay within
  # what the existing links carry.
  # Source: Embassy of India, Kathmandu, Visit of External Affairs Minister
  # Dr. S. Jaishankar to Nepal (04-05 January 2024),
  # https://www.indembkathmandu.gov.in/media-detail/146
  link_import_cap:
    links:
    - TRNINDEANPLXX
    - TRNINDNONPLXX
    from_country: IND
    to_country: NPL
    first_year: 2027
authorities:
  scenario_registry: project:config/setups/south_asia.yaml
  scenario_inputs:
    path: project:inputs/scenarios
    kind: directory
  scenario_config_root:
    path: project:config/scenarios
    kind: directory
  scenario_workbook: project:inputs/scenarios/OSTRAM_Scenario_Inputs.xlsx
  timeslice_workbook: project:inputs/scenarios/OSTRAM_Timeslice_Inputs.xlsx
  ao_decisions: project:inputs/scenarios/OSTRAM_Scenario_Inputs.xlsx
  interconnector_authority: project:inputs/scenarios/OSTRAM_Scenario_Inputs.xlsx
  interconnector_taxonomy: project:config/scenarios/technology_types.csv
  compilation_config: project:config/compilation/Config_MOMF_T1_A.yaml
  execution_config: project:config/execution/Config_MOMF_T1_AB.yaml
  execution_inputs:
    path: project:inputs/execution
    kind: directory
  country_config: project:config/preparation/Config_country_codes.yaml
  region_config: project:config/preparation/Config_region_consolidation.yaml
  osemosys_inputs:
    path: project:inputs/osemosys_global
    kind: directory
  preparation_inputs:
    path: project:inputs/preparation
    kind: directory
  preparation_templates:
    path: project:inputs/preparation/workbook_templates
    kind: directory
  preparation_config:
    path: project:config/preparation
    kind: directory
  preparation_resources:
    path: package:resources/preparation
    kind: directory
  compilation_resources:
    path: package:resources/compilation
    kind: directory
  secondary_technology_inputs:
    path: project:inputs/preparation/secondary_technologies
    kind: directory
  maintained_model: project:model/osemosys_fast_preprocessed.txt
scenario_registry:
  schema: ostram-scenario-registry-v1
  support_scenarios:
  - BAU
  root_scenarios:
  - name: BAU
    role: support
    dependencies: []
  - name: A_Calibrated_BAU
    role: decision
    dependencies:
    - type: restrictions
      scenario: BAU
  - name: B_Optimised_VRE
    role: decision
    dependencies: []
  - name: C_Target_VRE
    role: decision
    dependencies:
    - type: result
      scenario: A_Calibrated_BAU
      environment: OSTRAM_A_CALIBRATED_BAU_RESULT
      default_path: Executables/A_Calibrated_BAU_0
  decision_scenarios:
  - A_Calibrated_BAU
  - A_Calibrated_BAU_Clipped
  - B_Optimised_VRE
  - B_Opt_Clipped
  - B_Opt_DirBidir
  - B_Opt_DirContractual
  - B_Opt_IndiaCosts
  - B_Opt_IndiaCostsFuel
  - B_Opt_SolarCapex130
  - B_Opt_SolarCapexHi
  - B_Opt_SolarCapexSpike
  - B_Opt_TradeCap15
  - B_Opt_TxCap150
  - C_Target_VRE
  - C_Target_VRE_Clipped
  - A_Calibrated_BAU_Clipped_TxFreeze2026
  - B_Opt_Clipped_GrossImportCap15
  - A_Calibrated_BAU_TxCostLow
  - A_Calibrated_BAU_TxCostHigh
  - B_Optimised_VRE_TxCostLow
  - B_Optimised_VRE_TxCostHigh
  - C_Target_VRE_TxCostLow
  - C_Target_VRE_TxCostHigh
  # Derived scenarios whose edits read a solved parent of the same run. Each
  # result folder is read from the environment variable, or else from
  # default_path under the execution workspace.
  derived_dependencies:
    B_Opt_TxCap150:
    - type: result
      scenario: B_Optimised_VRE
      environment: OSTRAM_B_OPTIMISED_VRE_RESULT
      default_path: Executables/B_Optimised_VRE_0
    B_Opt_TradeCap15:
    - type: result
      scenario: B_Optimised_VRE
      environment: OSTRAM_B_OPTIMISED_VRE_RESULT
      default_path: Executables/B_Optimised_VRE_0
    A_Calibrated_BAU_Clipped_TxFreeze2026:
    - type: result
      scenario: A_Calibrated_BAU_Clipped
      environment: OSTRAM_A_CALIBRATED_BAU_CLIPPED_RESULT
      default_path: Executables/A_Calibrated_BAU_Clipped_0
vre_ceilings:
  description: Shared VRE ceilings. Each value sets TotalAnnualMaxCapacity (GW) of
    one solar or onshore wind technology to the same value in every year. The values
    were chosen once as the lower of an atlas-based estimate and the historical
    B_Optimised_VRE limit. The pipeline applies them as fixed values and does not
    recalculate them.
  param: TotalAnnualMaxCapacity
  sheet: Secondary Techs
  ceilings_gw:
    PWRSPVINDEA: 150
    PWRSPVINDNE: 25
    PWRSPVINDNO: 600
    PWRSPVINDSO: 500
    PWRSPVINDWE: 650
    PWRSPVBGDXX: 40
    PWRSPVLKAXX: 16
    PWRSPVNPLXX: 40
    PWRSPVBTNXX: 1.8102
    PWRSPVMDVXX: 1
    PWRWONINDEA: 0.0
    PWRWONINDNE: 0.0
    PWRWONINDNO: 285
    PWRWONINDSO: 445
    PWRWONINDWE: 410
    PWRWONBGDXX: 3
    PWRWONLKAXX: 15
    PWRWONNPLXX: 0.0
    PWRWONBTNXX: 0.5
    PWRWONMDVXX: 0
