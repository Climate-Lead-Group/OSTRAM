# Config_country_codes.yaml
# Single source of truth for country codes, names, and technology mappings

# ============================================================
# COUNTRY CONFIGURATION (Single Source of Truth)
# ============================================================
# Each country: iso3 key, english_name, ostram_name (Spanish, for OSTRAM & Shares Excel files)
country_data:
  BGD:
    english_name: "Bangladesh"
    ostram_name: "Bangladesh"
  BTN:
    english_name: "Bhutan"
    ostram_name: "Bhutan"
  IND:
    english_name: "India"
    ostram_name: "India"
  NPL:
    english_name: "Nepal"
    ostram_name: "Nepal"
  LKA:
    english_name: "Sri Lanka"
    ostram_name: "Sri Lanka"
  MDV:
    english_name: "Maldives"
    ostram_name: "Maldives"

# Special entries (not model countries, used in iso_country_map)
special_entries:
  INT: "International Markets"

# ============================================================
# MODEL SETTINGS
# ============================================================

# Reference year for the model (first year of the model horizon)
first_year: 2023

# Whether to add missing countries' demand data from OSTRAM generation file
# When true, A1 reads OSTRAM Excel to fill in countries not present in the input CSVs
add_missing_countries_from_ostram: false

# PWR technology cleanup mode (handles PWR00/PWR01 duplicates):
#   "drop"  - drop PWR00 rows when PWR01 exists, then rename PWR01 (removes '01' suffix)
#   "merge" - sum PWR00 values into PWR01, then drop PWR00, then rename PWR01
#   false   - skip PWR cleanup entirely
pwr_cleanup_mode: merge

# Force Projection.Mode = "EMPTY" for TotalAnnualMaxCapacityInvestment on all PWR technologies
#   true  - override Projection.Mode to EMPTY for all PWR techs on that parameter
#   false - keep the auto-detected Projection.Mode
force_empty_max_capacity_investment_pwr: true                                                                                              
# ============================================================
# TECHNOLOGY CONFIGURATION
# ============================================================

# Technology name (in Excel source files) -> model 3-char code
ostram_tech_mapping:
  Nuclear: URN
  "Natural gas": NGS
  "Mineral coal": COA
  Hydro: HYD
  Geothermal: GEO
  Wind: WON
  Solar: SPV
  # BIO is special: sum of Biogas + Solid biomass + Liquid biofuels

# Model tech code -> description
code_to_energy:
  MIN: "Mining tradable commodity"
  RNW: "Mining non-tradable (renewable) commodity"
  BIO: "Biomass"
  GAS: "Natural Gas"
  COA: "Coal"
  GEO: "Geothermal"
  HYD: "Hydroelectric"
  OIL: "Oil"
  OTH: "Other"
  PET: "Petroleum"
  SPV: "Solar Photovoltaic"
  URN: "Nuclear"
  WAV: "Wave"
  WAS: "Waste"
  WOF: "Offshore Wind"
  WON: "Onshore Wind"
  CCG: "Combined Cycle Natural Gas"
  COG: "Cogeneration"
  CSP: "Concentrated Solar Power"
  NGS: "Natural Gas"
  OCG: "Open Cycle Natural Gas"
  TRN: "Transmission technology"
  LDS: "Long duration storage"
  SDS: "Short duration storage"
  PWR: "Power generator"
  ELC: "Electricity"
  BCK: "Backstop"
  CCS: "Carbon Capture Storage with Coal"

# Renewable fuel codes (used to classify technologies)
renewable_fuels:
  - BIO
  - HYD
  - CSP
  - GEO
  - SPV
  - WAS
  - WON
  - WOF

# Shares technology name -> model tech code (for Shares_Power_Generation_Technologies.xlsx)
shares_tech_mapping:
  Biomass: BIO
  Bunker: OIL
  Coal: COA
  Diesel: PET
  Wind: WON
  "Fuel oil": OIL
  "Natural gas": NGS
  Geothermal: GEO
  Hydroelectric: HYD
  Nuclear: URN
  "Solar (DG)": SPV
  "Solar (utility scale)": SPV

# ============================================================
# COUNTRY LIST & TRANSMISSION TECHNOLOGY PARAMETERS
# ============================================================

# List of country codes (used by A2_AddTx for region pairs)
countries:
  # - "BGD"
  # - "BTN"
  # - "IND"
  # - "NPL"
  # - "LKA"
  # - "MDV"
  - "BGD"
  - "BTN"
  - "INDEA"    # India East
  - "INDNE"    # India North-East
  - "INDNO"    # India North
  - "INDSO"    # India South
  - "INDWE"    # India West
  - "NPL"
  - "LKA"
  - "MDV"

# ============================================================
# TEMPLATE GENERATION (for Z_generate_country_template.py)
# ============================================================
# Configure here and just run: python Z_generate_country_template.py
# The script processes each entry in the list sequentially.
#
# Fields per entry:
#   new_country:          3-letter ISO code for the new country
#   reference_country:    existing country to clone data from
#   region:               region code (default: XX). Use 2-letter code for sub-regions
#   interconnections:     list of neighbor codes (3-letter = region XX, 5-letter = explicit region)
#                         leave empty for zero interconnections
#                         remove the key entirely for legacy mode (copies reference topology)
#   centerpoint_lat:      latitude of the country/region centerpoint
#   centerpoint_lon:      longitude of the country/region centerpoint
#
# ── EXAMPLES ──────────────────────────────────────────────────
#
# Example 1: Single country, single region (most common case)
#   - new_country: MDV
#     reference_country: LKA
#     region: XX
#     centerpoint_lat: 1.924992
#     centerpoint_lon: 73.399658
#     interconnections:
#       - LKA
#
# Example 2: Multiple countries at once
#   - new_country: MMR
#     reference_country: BGD
#     region: XX
#     centerpoint_lat: 16.871311
#     centerpoint_lon: 96.199379
#     interconnections:
#       - BGD
#       - IND
#   - new_country: PAK
#     reference_country: IND
#     region: XX
#     centerpoint_lat: 24.87
#     centerpoint_lon: 66.99
#     interconnections:
#       - INDNO
#       - INDWE
#
# Example 3: Country with multiple regions (like India)
#   Each region needs its own entry with its own centerpoint.
#   Use 5-letter codes for interconnections to specific regions.
#   - new_country: CHN
#     reference_country: IND
#     region: SO                          # China South → CHNSO
#     centerpoint_lat: 23.145
#     centerpoint_lon: 113.325
#     interconnections:
#       - MMRXX
#       - CHNNO                           # connected to China North
#   - new_country: CHN
#     reference_country: IND
#     region: NO                          # China North → CHNNO
#     centerpoint_lat: 39.929
#     centerpoint_lon: 116.388
#     interconnections:
#       - CHNSO                           # connected to China South
#       - MNGXX
#
# ── ACTIVE CONFIGURATION ─────────────────────────────────────
template_generation:
  - new_country: MDV
    reference_country: LKA
    region: XX
    centerpoint_lat: 1.924992
    centerpoint_lon: 73.399658
    interconnections:
      - LKA

# Implausible technology-country combinations based on OG_csvs_inputs data
# (ResidualCapacity, CapitalCost, TotalAnnualMaxCapacityInvestment, TotalAnnualMaxCapacity)
# A combo is implausible when all four parameters are zero for every year
# Format: technology_code -> list of country codes where it is implausible
implausible_combinations:
  # BIO (Biomass) - No biomass resources or grid-connected capacity
  BIO: [BTN, MDV]
  # CCS (Carbon Capture Storage with Coal) - No coal infrastructure to retrofit
  CCS: [BTN, NPL, LKA, MDV]
  # COA (Coal) - No coal plants, no coal resources, no plans
  COA: [BTN, NPL, MDV]
  # COG (Cogeneration) - No industrial base for cogeneration
  COG: [BTN, NPL, MDV]
  # CSP (Concentrated Solar Power) - Unsuitable climate/terrain or insufficient land area
  CSP: [BGD, BTN, NPL, LKA, MDV]
  # GAS (Natural Gas) - No PWRGAS technology in model; gas generation modeled via CCG/OCG → NGS
  GAS: [BGD, BTN, IND, NPL, LKA, MDV]
  # GEO (Geothermal) - No geothermal resources in any modeled country
  GEO: [BGD, BTN, IND, NPL, LKA, MDV]
  # HYD (Hydroelectric) - Flat coral atolls, no rivers or elevation
  HYD: [MDV]
  # NGS (Natural Gas unified) - No CCG/OCG/NGS power data
  NGS: [BTN, NPL, MDV]
  # OIL (Oil/Fuel Oil) - No oil-fired grid power plants
  OIL: [BTN, NPL, MDV]
  # URN (Nuclear) - No nuclear program or plans
  URN: [BTN, NPL, LKA, MDV]
  # WAS (Waste-to-Energy) - No waste-to-energy plants or plans
  WAS: [BTN, MDV]
  # WAV (Wave Energy) - No capacity or plans; BTN and NPL are landlocked
  WAV: [BGD, BTN, IND, NPL, LKA, MDV]
  # WOF (Offshore Wind) - BTN/NPL landlocked; MDV scale economically unviable
  WOF: [BTN, NPL, MDV]
  # WON (Onshore Wind) - No country lacks onshore wind data except MDV
  WON: [MDV]

# Technology parameters
#
# WARNING: DEAD KEY: `TotalAnnualMaxCapacityInvestment` in the six
#   family blocks below is NOT compiled for transmission. transmission.py process_parametrization
#   reads PARAM_LIST = [CapitalCost, FixedCost, ResidualCapacity,
#   TotalAnnualMinCapacityInvestment, TotalAnnualMaxCapacity], which OMITS it. Do NOT
#   rename it to a live key (e.g. TotalAnnualMaxCapacity): that would cap internal
#   transmission at 5 GW/yr. Leave as-is.
# Renewable transmission technologies
#Existing renewable transmission technologies
RNWTRN:
  CapacityToActivityUnit: 31.536
  OperationalLife: 40
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5
#Repowered renewable transmission technologies
RNWRPO:
  CapacityToActivityUnit: 31.536
  OperationalLife: 40
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5
#New lines of renewable transmission technologies
RNWNLI:
  CapacityToActivityUnit: 31.536
  OperationalLife: 40
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5

# Non-renewable transmission technologies
#Existing non-renewable transmission technologies
PWRTRN:
  CapacityToActivityUnit: 31.536
  OperationalLife: 40
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5
#Repowered non-renewable transmission technologies
TRNRPO:
  CapacityToActivityUnit: 31.536
  OperationalLife: 40
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5
#New lines of non-renewable transmission technologies
TRNNLI:
  CapacityToActivityUnit: 31.536
  OperationalLife: 40
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5

# ============================================================
# INTERNAL (intra-node) transmission calibration
# ============================================================
# Applied by the late A3 stage `stage_internal_transmission`
# (ostram/pipeline/scenarios/rules/apply_internal_transmission.py), which is
# authoritative for the delivered model: it overrides the flat A2 placeholders and the Stage-1
# OperationalLife (50/20) with the values below, on the six internal families
# (RE: RNWTRN/RNWNLI/RNWRPO, non-RE: PWRTRN/TRNNLI/TRNRPO).
#   * CapitalCost/FixedCost are the same in every node and computed in every run from
#     the sourced inputs below (internal_grid_costs in the rule):
#       base_capital_cost   = esmap_capital_cost_usd2010_per_kw x muv_2023 / muv_2010
#       base_fixed_cost     = fixed_cost_share x base_capital_cost
#       re_add_on           = gec2_cost_rs_crore x 1e7 / (gec2_capacity_mw x 1e3)
#                             / inr_per_usd_2022 x muv_2023 / muv_2022
#       re_capex_multiplier = (base_capital_cost + re_add_on) / base_capital_cost
#     non-RE = base; RE = base x re_capex_multiplier. Each input names its source or
#     ASSUMPTION.
#   * OperationalLife applies to all 6 families.
#   * The base-year ResidualCapacity of RNWTRN<node> and PWRTRN<node> is computed in
#     every run by the A3 stage `stage_internal_tx_residuals`, after the base-year pin,
#     from the 2023 inputs the model compiles: RNWTRN = residual_peak_margin x RE at the
#     node's peak time slice, PWRTRN = residual_peak_margin x peak - RNWTRN (RNWTRN =
#     margin x peak and PWRTRN = 0 when RE at peak exceeds the peak). NLI/RPO = 0.
#     docs/rules.md gives the inputs and the formula.
internal_transmission:
  # USD2010 per kW. ESMAP (2026), Understanding the Cost of Transmission Infrastructure,
  # Table 4.3, South Asia, 400 kV line carrying 1,000 MW over 250 km: US$96 million, so
  # 96 $/kW in 2010 US dollars
  # (https://documents1.worldbank.org/curated/en/099040926152055780/pdf/P506480-a2f4b5e4-cca9-437b-b33d-38293adae0e7.pdf).
  # ASSUMPTION: 400 kV is the backbone voltage of the India nodes and 250 km is the
  # shorter of ESMAP's two example lengths; real distances and voltages vary greatly
  # between nodes, and one value is used for every node.
  esmap_capital_cost_usd2010_per_kw: 96
  # World Bank MUV index, 2010 = 100. Commodity Markets "Pink Sheet" annual file
  # (https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Annual.xlsx),
  # worksheet "Annual Indices (Real)", column R "Deflator MUV Index": row 60 (2010),
  # row 72 (2022) and row 73 (2023).
  muv_2010: 100
  muv_2022: 117.5
  muv_2023: 114.1
  # Share of the capital cost paid each year as fixed O&M. ESMAP (2026) reports O&M of
  # 2 to 3% of capital cost in 41 World Bank projects and uses 3% in its cost tables
  # (same URL as the capital cost).
  fixed_cost_share: 0.03
  # ASSUMPTION: renewable plants pay a connection cost of 76.52 USD2023/kW on top of the
  # shared internal grid cost, because renewable parks sit away from load and need
  # pooling stations and connection lines. The value is the average of India's Green
  # Energy Corridor Phase II (Rs 12,031.33 crore for 19,431 MW), an approved estimate
  # taken as 2022 prices. It may overlap some backbone reinforcement inside the shared
  # cost, and it is one value for every node.
  # MNRE, Scheme Sanction and Guidelines of GEC-II, F. No. 367-12/1/2022-GEC, 4 March
  # 2022, listed on https://mnre.gov.in/en/gec-phase-ii/: estimated project cost
  # Rs 12,031.33 crore excluding interest during construction (p. 1, para 3; p. 6,
  # section 3.1); renewable addition envisaged 19,431 MW (Annexure I, section 2.2, table
  # total, pp. 5 to 6).
  gec2_cost_rs_crore: 12031.33
  gec2_capacity_mw: 19431
  # Rupees per US dollar, 2022 annual average. FRED series AEXINUS, Federal Reserve G.5A
  # (https://fred.stlouisfed.org/series/AEXINUS).
  inr_per_usd_2022: 78.5792
  # Years, all six internal families: the transmission asset life ESMAP (2026) assumes
  # in its cost tables (same URL).
  operational_life: 40
  # ASSUMPTION: a transmission-only loss of 3% inside each node, uniform across
  # nodes, rounded below Grid-India's all-India interstate transmission loss notices
  # (https://web.archive.org/web/20250118134515/https://posoco.in/en/side-menu-pages/applicable-transmission-losses/).
  # Demand rows measured at the bus bar are multiplied by 1 - loss; imports cross the
  # receiving node's internal grid; an interconnector sent from a bus-bar node draws
  # 1 - loss per unit of activity, because the published requirement already holds
  # the losses export flows cause.
  # OutputActivityRatio of the six internal families = 1 - loss.
  transmission_loss: 0.03
  # ASSUMPTION: the 2023 internal grid of a node carries 1.2 times its 2023 peak
  # time-slice demand, a margin above the peak for the spread of load inside the node.
  residual_peak_margin: 1.2

# Enable DSPTRN dispatch technology (adds ELC03/ELC04 tier for interconnections)
enable_dsptrn: true

# Dispatch transmission technology (routes electricity through ELC03 tier)
DSPTRN:
  CapacityToActivityUnit: 31.536
  OperationalLife: 20
  CapitalCost: 0
  FixedCost: 0
  ResidualCapacity: 9999
  TotalAnnualMaxCapacityInvestment: 9999
