  - {label: Transmission, path: transmission/internal-grid.html, section: Transmission}
  - {label: Scenarios, path: scenarios.html, section: Scenarios}
  - {label: Applications, path: applications/index.html, section: Applications}
  - {label: Run it, path: running.html, section: Use the model}
  - {label: Sources, path: data.html, section: Evidence}
  - {label: Paper, path: paper.html, section: Project}

pages:
  - {path: index.html, template: home.html, section: Start}
  - {path: model/choices.html, template: choices.html, section: The model}
  - {path: model/rules.html, template: rules.html, section: The model}
  - {path: model/node.html, template: node.html, section: The model}
  - {path: transmission/internal-grid.html, template: internal-grid.html, section: Transmission}
  - {path: transmission/interconnectors.html, template: interconnectors.html, section: Transmission}
  - {path: transmission/import-caps.html, template: import-caps.html, section: Transmission}
  - {path: transmission/build-caps.html, template: build-caps.html, section: Transmission}
  - {path: transmission/repowering.html, template: repowering.html, section: Transmission}
  - {path: transmission/internal-costs.html, template: internal-costs.html, section: Transmission}
  - {path: scenarios.html, template: scenarios.html, section: Scenarios}
  - {path: applications/index.html, template: applications.html, section: Applications}
  - {path: "applications/{setup}.html", template: application.html, placeholder: application-placeholder.html, section: Applications, per_setup: true}
  - {path: running.html, template: running.html, section: Use the model}
  - {path: code-map.html, template: code-map.html, section: Use the model}
  - {path: data.html, template: data.html, section: Evidence}
