  - {path: paper.html, template: paper.html, section: Project}
  - {path: roadmap.html, template: roadmap.html, section: Project}

# Pipeline stages and the package folder of each, for the code map.
stages:
  - {stage: A1, does: Prepare the base model from the OSeMOSYS Global inputs and the country data., folder: ostram/pipeline/preparation/base_inputs.py}
  - {stage: A2, does: Add the internal grid families and the interconnectors., folder: ostram/pipeline/preparation/transmission.py}
  - {stage: A3, does: Build each scenario from its rules and edits., folder: ostram/pipeline/scenarios}
  - {stage: B1, does: Compile the scenario workbooks into model input files., folder: ostram/pipeline/compilation}
  - {stage: B2, does: Write the model datafile, apply the run-time constraints, solve and collect results., folder: ostram/pipeline/execution}
  - {stage: Reports, does: Read results into the summary workbook and dashboard., folder: ostram/reporting}
  - {stage: Site, does: Build this website., folder: ostram/site}
