# Site configuration for python -m ostram site.
# Text and page order only: every count and value on the site is read from the
# repository when the site is built (see ostram/site/values.py).

description: >-
  OSTRAM, OSeMOSYS for Transmission: an open framework that plans power systems
  with internal transmission and the interconnectors between countries, built for
  the Global South.
repository_url: https://github.com/Climate-Lead-Group/OSTRAM
docs_url: https://ostram.readthedocs.io/en/latest/
mermaid_url: https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs
glossary_page: glossary.html

# The applications the site presents. A setup that is not registered shows its
# placeholder page until it is added to config/setups/registry.json.
applications:
  - setup: south_asia
    name: South Asia
    route: Custom-built dataset
    summary: >-
      Bangladesh, Bhutan, the regions of India, Nepal, Sri Lanka and the Maldives,
      built from national statistics, plant lists and corridor studies on top of
      OSeMOSYS Global.
    placeholder: The South Asia setup is the reference application.
  - setup: lac
    name: Latin America and the Caribbean
    route: Built from OLADE data
    summary: >-
      The same framework fed from the regional energy statistics of OLADE, the
      Latin American Energy Organization.
    placeholder: >-
      The Latin America and the Caribbean application is being built from OLADE
      data with the same framework. Its counts, scenarios and transmission pages
      appear here when its setup is registered.

worked_example:
  setup: south_asia
  node: BGDXX

sections:
  - Start
  - The model
  - Transmission
  - Scenarios
  - Applications
  - Use the model
  - Evidence
  - Project

