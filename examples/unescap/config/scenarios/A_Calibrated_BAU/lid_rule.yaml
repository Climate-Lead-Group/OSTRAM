## lid_rule.yaml — A_Calibrated_BAU scenario override
## Updated: 2026-05-26
##
## Key differences from B_Optimised_VRE:
##   - NO relaxation (flat 1.0× — pure BAU proportions for all families)
##   - ALL generation families locked at 1.0
##   - Storage STILL exempt (PWRSDS/PWRLDS not in GENERATION category,
##     so removing them from exempt causes MaxCapInv=0 vs MinCapInv>0
##     infeasibility). Use storage_delay_active: True in B2 YAML to
##     block early-year builds. The 36.9 GW LKA anomaly may recur —
##     if so, a storage-specific cap mechanism is needed in a future
##     iteration.

rule_mode: proportional
security_factor: 1.1

## Flat — no relaxation for calibrated BAU
relaxation_schedule:
  2023: 1.0
  2050: 1.0

## Minimum MaxCapInv (GW) per tech per year.
lid_floor_gw: 0.5

## Generation families locked at BAU proportions.
## Combined with the floor-respects-ceiling fix, families with
## near-zero BAU share (BIO, WAS) get near-zero MaxCapInv.
##
## NGS uses 1.01 (same convention as PET/OIL in B and C): with the flat
## 1.0 relaxation schedule this relaxes nothing, it only keeps gas
## eligible for lid_floor_gw (0.5 GW/yr). With NGS strictly locked the
## BAU pool is exhausted after ~2047, INDEA hydro hits its resource cap
## and only solar has lid room, so the model buys ~300 PJ of SDS storage
## plus PWRBCK backstop in 2048-2050 (A system cost 1.38M vs 0.56M with
## the gas floor; B/C ~0.55M). Half a GW/yr of gas in BGD/IND is the
## realistic BAU continuation.
family_relaxation_ceilings:
  COA: 1.0
  PET: 1.0
  OIL: 1.0
  BIO: 1.0
  WAS: 1.0
  NGS: 1.01   # gas keeps the 0.5 GW/yr floor (see note above)
  URN: 1.0

## Storage must stay exempt to avoid MinCapInv > MaxCapInv
## infeasibility (storage techs are not GENERATION, so the lid
## script won't touch them otherwise and MaxCapInv stays at 0
## from upstream).
exempt_prefixes:
  - PWRSDS
  - PWRLDS

## Adequacy floor — ensures the sum of gen MaxCapInv in each (cr, year)
## is at least this fraction of scaled_pool (ResidualCapacity × demand_mult).
## When the proportional lid produces a total below this floor, ALL per-tech
## lids in that cr are scaled up by the same factor, so BAU tech-share
## proportions and the family ceilings above are preserved.
##
## Zero through 2040 preserves near-term BAU calibration.  Ramps from 2041
## to provide system headroom at end of horizon, where pool_delta collapses
## as retirements exhaust the BAU pool.  Without this, A_Calibrated_BAU
## builds ~28.7 GW of PWRBCK backstop in BGDXX/INDEA over 2048-2050 (total
## allowed gen MaxCapInv falls to ~1.5 GW/yr while demand grows ~25% in
## 2045-2050), inflating the system cost ~100x versus B/C.
## Same anchors as B_Optimised_VRE and C_Target_VRE.
adequacy_floor_schedule:
  2040: 0.0        # no floor through 2040
  2045: 0.08       # 8% by 2045
  2050: 0.20       # 20% by 2050
