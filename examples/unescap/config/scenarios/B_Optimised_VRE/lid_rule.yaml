## lid_rule.yaml — B_Optimised_VRE scenario override
## Updated: 2026-05-26  (added BIO/WAS family ceilings)

rule_mode: proportional
security_factor: 1.1

relaxation_schedule:
  2023: 1.0
  2027: 1.0
  2030: 3.0       # was 1.1
  2035: 6.0       # was 1.3
  2040: 10.0       # was 1.5
  2045: 15.0       # was 2.0
  2050: 25.0      # was 3.0

## Minimum MaxCapInv (GW) per tech per year.  Prevents the lid from
## collapsing to zero when retirement drives pool_delta negative.
lid_floor_gw: 0.1

## Family-specific relaxation ceilings.  Caps the relaxation multiplier
## for techs whose family code (chars 3..6 of tech code) matches a key.
## Families not listed get the full relaxation_schedule value.
## A ceiling of 1.0 = locked to BAU proportions (no relaxation).
##
## IMPORTANT: families with ceiling <= 1.0 are "locked" families.
## The lid_floor_gw does NOT apply to locked families — their effective
## lid is purely proportional (share × pool_delta × ceiling).  This
## prevents the floor from acting as an implicit per-tech subsidy
## for families with near-zero BAU share.
family_relaxation_ceilings:
  COA: 1.0
  PET: 1.01
  OIL: 1.01
  BIO: 1.0
  WAS: 1.0
  NGS: 1.2
  URN: 1.5
  HYD: 3.0        # NEW — stop hydro riding the 10×
  SHP: 3.0        # NEW — same
  # SPV/WON/CSP stay unlisted → they get the full 20×

## Uncap storage — upstream scripts set storage MaxCapInv to 0,
## and the lid script's preserve-manual rule keeps them there.
## Exempting them forces MaxCapInv = 9999 (uncapped).
exempt_prefixes:
  - PWRSDS     # Short-duration storage
  - PWRLDS     # Long-duration storage

## Adequacy floor — ensures the sum of gen MaxCapInv in each (cr, year)
## is at least this fraction of scaled_pool (ResidualCapacity × demand_mult).
## When the proportional lid produces a total below this floor, ALL per-tech
## lids are scaled up by the same factor (preserving tech-share structure
## and family ceilings).
##
## Zero through 2040 preserves near-term BAU calibration.  Ramps from 2041
## to provide enough system headroom at end of horizon where pool_delta
## collapses due to retirements.  Without this, backstop fires in large
## Indian regions at 2048-2050.
##
## Anchor points are linearly interpolated (same as relaxation_schedule).
## 0.0 = no floor for that year.
adequacy_floor_schedule:
  2040: 0.0        # no floor through 2040
  2045: 0.08       # 8% by 2045
  2050: 0.20       # 20% by 2050 — sized from the largest end-of-horizon adequacy gap
