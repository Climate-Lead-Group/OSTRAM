## storage_floors.yaml — B_Optimised_VRE storage deployment nudge
##
## Very small TotalAnnualMinCapacityInvestment (GW) per tech per year.
## Just enough to seed storage in the model; the optimizer decides the
## real scale.  Values are PER TECH (e.g. 0.05 GW for PWRSDSBGDXX,
## 0.05 GW for PWRSDSINDEA).
##
## Years between anchors are linearly interpolated.
## Years before the first anchor get 0 (no floor).
## Years after the last anchor hold the last value.

storage_floors:
  SDS:            # short-duration (battery)
    2029: 0.05    # 50 MW/region — seed deployment
    2030: 0.10    # 100 MW/region
    2035: 0.20    # 200 MW/region
    2040: 0.30    # 300 MW/region
    2050: 0.30    # hold steady — optimizer takes over
  LDS:            # long-duration (pumped hydro, etc.)
    2030: 0.05    # 50 MW/region — seed
    2035: 0.10    # 100 MW/region
    2040: 0.15    # 150 MW/region
    2050: 0.15    # hold steady
