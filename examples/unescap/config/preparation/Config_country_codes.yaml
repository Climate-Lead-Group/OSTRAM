  OperationalLife: 20
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5
#Repowered renewable transmission technologies
RNWRPO:
  CapacityToActivityUnit: 31.536
  OperationalLife: 20
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5
#New lines of renewable transmission technologies
RNWNLI:
  CapacityToActivityUnit: 31.536
  OperationalLife: 20
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5

# Non-renewable transmission technologies
#Existing non-renewable transmission technologies
PWRTRN:
  CapacityToActivityUnit: 31.536
  OperationalLife: 20
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5
#Repowered non-renewable transmission technologies
TRNRPO:
  CapacityToActivityUnit: 31.536
  OperationalLife: 20
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5
#New lines of non-renewable transmission technologies
TRNNLI:
  CapacityToActivityUnit: 31.536
  OperationalLife: 20
  CapitalCost: 100
  FixedCost: 4
  ResidualCapacity: 5
  TotalAnnualMaxCapacityInvestment: 5

# Enable DSPTRN dispatch technology (adds ELC03/ELC04 tier for interconnections)
enable_dsptrn: true

# Dispatch transmission technology (routes electricity through ELC03 tier)
DSPTRN:
  CapacityToActivityUnit: 31.536
  OperationalLife: 20
  CapitalCost: 0
  FixedCost: 0
  ResidualCapacity: 9999
  TotalAnnualMaxCapacityInvestment: 9999
